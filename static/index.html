<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Browser View</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #333;
      }
      #video {
        width: 100vw;
        height: 100vh;
        object-fit: fill;
        background-color: black;
      }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <video
      id="video"
      autoplay
      playsinline
      webkit-playsinline
    ></video>
    <div id="status">Connecting...</div>

    <script>
      const videoElement = document.getElementById("video");
      const statusElement = document.getElementById("status");
      let pc; // RTCPeerConnection
      let ws; // WebSocket for input
      let sessionId = null;
      let token = ""; // JWT is disabled in config.yml, so no token is needed

      // Function to update status message
      function updateStatus(message) {
        statusElement.textContent = message;
      }

      
        iceServers = [
          // { "urls": 'stun:stun.l.google.com:19302' },
          {
            urls: "stun:stun.relay.metered.ca:80"
          },
          {
            urls: "turn:global.relay.metered.ca:80",
            username: "84b2500cd237d2601e7056bd",
            credential: "HUbJ8CeFXMFqVPcL"
          },
          {
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: "84b2500cd237d2601e7056bd",
            credential: "HUbJ8CeFXMFqVPcL"
          },
          {
            urls: "turn:global.relay.metered.ca:443",
            username: "84b2500cd237d2601e7056bd",
            credential: "HUbJ8CeFXMFqVPcL"
          },
          {
            urls: "turns:global.relay.metered.ca:443?transport=tcp",
            username: "84b2500cd237d2601e7056bd",
            credential: "HUbJ8CeFXMFqVPcL"
          }
          // {
          //   "urls": "stun:global.stun.twilio.com:3478"
          // },
          // {
          //   "credential": "iMNQsOQiSEx6KlaYt0qEu2pQFcBvKi/NrLMbEx1Yn8k=",
          //   "urls": "turn:global.turn.twilio.com:3478?transport=udp",
          //   "username": "9fd980264c6f3c19f68b59dafc27425a8633354695542d094e11210ab33b9cc7"
          // },
          // {
          //   "credential": "iMNQsOQiSEx6KlaYt0qEu2pQFcBvKi/NrLMbEx1Yn8k=",
          //   "urls": "turn:global.turn.twilio.com:3478?transport=tcp",
          //   "username": "9fd980264c6f3c19f68b59dafc27425a8633354695542d094e11210ab33b9cc7"
          // },
          // {
          //   "credential": "iMNQsOQiSEx6KlaYt0qEu2pQFcBvKi/NrLMbEx1Yn8k=",
          //   "urls": "turn:global.turn.twilio.com:443?transport=tcp",
          //   "username": "9fd980264c6f3c19f68b59dafc27425a8633354695542d094e11210ab33b9cc7"
          // }
          // add TURN as needed
        ]
      

      async function start() {
        updateStatus("Starting WebRTC connection...");
        pc = new RTCPeerConnection(iceServers)

        pc.ontrack = (event) => {
          if (event.track.kind === "video") {
            videoElement.srcObject = event.streams[0];
            if (videoElement) {
              videoElement.play().catch((error) => {
                console.error("Error attempting to play video:", error);
                updateStatus(
                  "Video stream received, but failed to autoplay. Please click anywhere on the page to start video."
                );
              });
              updateStatus("Video stream received. Click to play.");
            } else {
              console.error("videoElement is not defined.");
              updateStatus(
                "Video stream received, but video element is not defined."
              );
            }
          }
        };

        pc.oniceconnectionstatechange = () => {
          updateStatus(`ICE connection state: ${pc.iceConnectionState}`);
          if (
            pc.iceConnectionState === "failed" ||
            pc.iceConnectionState === "closed" ||
            pc.iceConnectionState === "disconnected"
          ) {
            console.error("WebRTC connection failed or closed.");
            updateStatus("WebRTC connection failed. Please refresh.");
            if (ws) ws.close();
          }
        };

        pc.onconnectionstatechange = () => {
          updateStatus(`WebRTC connection state: ${pc.connectionState}`);
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            // Send ICE candidates to the server if needed, though for simple cases,
            // the initial offer/answer exchange might be enough.
            // For now, we'll rely on the initial offer/answer.
          }
        };

        try {
          // IMPORTANT: Add this line to explicitly declare the intention to receive video
          pc.addTransceiver("video", { direction: "recvonly" });

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          updateStatus("Sending SDP offer to server...");
          const response = await fetch(`/api/v1/ws/offer`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
              // 'Authorization': `Bearer ${token}` // JWT is disabled in config.yml
            },
            body: JSON.stringify({
              sdp: pc.localDescription.sdp,
              type: pc.localDescription.type
            })
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(
              `Server error: ${response.status} - ${
                errorData.detail || response.statusText
              }`
            );
          }

          const answer = await response.json();
          sessionId = answer.session_id;
          updateStatus(`Received SDP answer. Session ID: ${sessionId}`);
          await pc.setRemoteDescription(new RTCSessionDescription(answer));

          updateStatus(
            "WebRTC connection established. Starting input WebSocket..."
          );
          connectWebSocket();
        } catch (error) {
          console.error("Error during WebRTC setup:", error);
          updateStatus(`Error: ${error.message}. Please check console.`);
        }
      }

      function connectWebSocket() {
        if (!sessionId) {
          console.error("No session ID available for WebSocket connection.");
          updateStatus("Error: No session ID. Cannot connect input.");
          return;
        }

        // Use secure WebSocket (wss) if served over HTTPS, otherwise ws
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(
          `${protocol}//${window.location.host}/api/v1/ws/${sessionId}`
        );

        ws.onopen = () => {
          updateStatus("Input WebSocket connected.");
          console.log("Input WebSocket connected.");
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          console.log("WebSocket message:", msg);
          if (msg.type === "js_result" || msg.type === "cdp_result") {
            console.log("Server result:", msg.result);
          } else if (msg.error) {
            console.error("Server error:", msg.error);
          }
        };

        ws.onclose = () => {
          updateStatus("Input WebSocket disconnected.");
          console.log("Input WebSocket disconnected.");
        };

        ws.onerror = (error) => {
          console.error("Input WebSocket error:", error);
          updateStatus("Input WebSocket error. Check console.");
        };
      }

      // Function to send input commands via WebSocket
      function sendInput(type, data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type, ...data }));
        } else {
          console.warn("WebSocket not open, cannot send input:", type, data);
        }
      }

      // Mouse input handling
      videoElement.addEventListener("mousemove", (event) => {
        const rect = videoElement.getBoundingClientRect();
        const x =
          ((event.clientX - rect.left) / rect.width) * videoElement.videoWidth;
        const y =
          ((event.clientY - rect.top) / rect.height) * videoElement.videoHeight;
        sendInput("mouse_move", { x, y });
      });

      videoElement.addEventListener("click", (event) => {
        const rect = videoElement.getBoundingClientRect();
        const x =
          ((event.clientX - rect.left) / rect.width) * videoElement.videoWidth;
        const y =
          ((event.clientY - rect.top) / rect.height) * videoElement.videoHeight;
        sendInput("mouse_click", { x, y, button: "left" });
      });

      // Keyboard input handling
      document.addEventListener("keydown", (event) => {
        // Prevent default browser actions for certain keys if needed
        // event.preventDefault();
        sendInput("key", { key: event.key });
      });

      // Start the process when the page loads
      window.onload = start;

      // Add event listener for user interaction to trigger play()
      document.addEventListener("click", function () {
        if (videoElement && videoElement.paused) {
          videoElement.play().catch((error) => {
            console.error(
              "Error attempting to play video after user interaction:",
              error
            );
            updateStatus("Failed to play video even after click.");
          });
        }
      });
    </script>
  </body>
</html>

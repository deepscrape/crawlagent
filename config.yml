# Application Configuration
app:
  title: "DeepScrape API"
  version: "0.1.0"
  host: "0.0.0.0"
  port: 8000
  reload: false  # Set to False in production
  workers: 1
  uvloop: auto
  timeout_keep_alive: 300
  cors_origins_dev:
    - "http://localhost:4200"
    - "http://localhost:8081"
    - "http://localhost:5000"
    - "https://deepscrape.web.app"
    - "https://deepscrape.dev"
  cors_origins:
    - "https://deepscrape.web.app"
    - "https://deepscrape.dev"
  gzip:
    minimum_size: 1000  # in bytes

# Virtual Display Manager Configuration
virtual_display_manager:
    enabled: true
    max_displays: 5
    start_display_num: 99
    start_debug_port: 5900
# Default LLM Configuration
llm:
  provider: "openai/gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  # api_key: sk-...  # If you pass the API key directly then api_key_env will be ignored

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

# Rate Limiting Configuration
rate_limiting:
  enabled: true # Set to True in production
  default_limit: "100/minute"
  trusted_proxies: []
  storage_uri: redis://${UPSTASH_REDIS_USER}:{UPSTASH_REDIS_PASS}@${UPSTASH_REDIS_REST_URL}:${UPSTASH_REDIS_PORT}  # Use "redis://localhost:6379" for production

# Security Configuration
security:
  enabled: true 
  jwt_enabled: true # Set to True in production
  https_redirect: false
  trusted_hosts: ["*"]
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

# Crawler Configuration
crawler:
  base_config:
    simulate_user: true
  memory_threshold_percent: 95.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0  # Timeout for stream initialization
    batch_process: 300.0  # Timeout for batch processing
  pool:
    max_pages: 40                          # ← GLOBAL_SEM permits
    idle_ttl_sec: 1800                     # ← 30 min janitor cutoff
  browser:
    kwargs:
      headless: false
      text_mode: false # ← text mode
    extra_args:
      # - "--single-process"
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"
      - "--disable-web-security"
      - "--allow-insecure-localhost"
      - "--ignore-certificate-errors"
    launch_args:
      - "--remote-debugging-address=0.0.0.0"
      - "--remote-debugging-port=3000"

# Logging Configuration
logging:
  enabled: true # Set to True in production
  level: "DEBUG" # Changed to DEBUG for troubleshooting
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Observability Configuration
observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

storage:
  primary:
    bucket: "crawlagent.bucket.a"
    region: "auto"
    endpoint: "https://fly.storage.tigris.dev"
    pool:
      max_connections: 20
      concurrent_request_limit: 100
  
  # Cache configuration
  cache:
    enabled: true
    ttl: 300  # 5 minutes in seconds
    prefix: "storage"
  
  # Retry configuration
  retry:
    max_attempts: 3
    base_delay: 1.0
    max_delay: 10.0
    exponential_base: 2
  
  # Monitoring configuration
  monitoring:
    enabled: true
    metrics_enabled: true
    health_check_enabled: true
  
  # Compression configuration
  compression:
    enabled: true
    level: 3  # zstd compression level (1-22)
    min_size: 1024  # Minimum file size to compress (bytes)
  
  backup:
    enabled: true
    buckets:
      - name: "crawlagent-backup-us"
        region: "us-east-1"
        endpoint: "https://fly.storage.tigris.dev"
      - name: "crawlagent-backup-eu" 
        region: "eu-west-1"
        endpoint: "https://fly.storage.tigris.dev"
    
    retention:
      daily_backups: 7
      weekly_backups: 4
      monthly_backups: 12
    
    schedule:
      incremental: "0 */6 * * *"  # Every 6 hours
      full: "0 2 * * 0"           # Weekly on Sunday 2 AM